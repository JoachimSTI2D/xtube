<!DOCTYPE html>
<html>
    <head>
        <title>XTube - Login</title>
        <meta charset="UTF-8">
        <style>
    body{
        width: 100%;
        height: 100%;
        padding-top: 10%;
        background-color: black;
        overflow: hidden;
    }
    *{
        z-index:0;
        cursor: url('./img/cursor.png'), auto;
    }
    input{
        background-color: transparent;
        border-color: white;
        height: 48px;
        width: 30%;
        border-radius: 10px;
        color: white;
        padding-left: 16px;
        border-width: 1px;
    }
    .login{
        text-align: center;
        align-self: center;
        align-content: center;
    }
    button{
        color: black;
        background-color: #ff6c00;
        padding-left: 50px;
        padding-right: 50px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-color: transparent;
        border-radius: 50px;
    }
    button:hover{
        color: black;
        background-color: #b94d00;
        padding-left: 50px;
        padding-right: 50px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-color: transparent;
        border-radius: 50px;
        cursor: pointer;
    }
        </style>
    </head>
    <body>
        <p class="login"><img src="./img/xtube_logo.png" class="login"></p> <br>
        <div class="login">
            <input placeholder="Username"> <br> <br>
            <input placeholder="Password" type="password"> <br> <br>
            <a href="index.html"><button>Login</button> <button>Register</button></a>
        </div>
    </body>
</html>
